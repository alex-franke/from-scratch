[project]
name = "from-scratch"
version = "0.1.0"
description = "A collection of algorithm implementations from the ground up, built to deepen understanding of core concepts in data science and machine learning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]
